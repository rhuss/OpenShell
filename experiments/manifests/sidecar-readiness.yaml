apiVersion: v1
kind: Pod
metadata:
  name: sidecar-readiness-test-PLACEHOLDER
spec:
  initContainers:
  - name: readiness-sidecar
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    restartPolicy: Always
    command: ["/agnhost"]
    args: ["netexec", "--http-port=8080"]
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      periodSeconds: 1
    volumeMounts:
    - name: signal
      mountPath: /tmp/signal
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
  containers:
  - name: sandbox
    image: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: signal
      mountPath: /tmp/signal
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
  volumes:
  - name: signal
    emptyDir: {}
